<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tow Log</title>
<style>
:root{--bg:#f1efe4;--surface:#fffffb;--ink:#1c2a1e;--muted:#5b695d;--line:#d6d3c2;--accent:#2d6a3a;--on-accent:#fff;--sock:#e2561a;--box:#e6f0e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--box:#243a2a;--bg:#121813;--surface:#1b241d;--ink:#e8ede6;--muted:#9aa89c;--line:#2e3a30;--accent:#6fc182;--on-accent:#0f1a12;--sock:#ff8a4d;color-scheme:dark}}
:root[data-theme="dark"]{--box:#243a2a;--bg:#121813;--surface:#1b241d;--ink:#e8ede6;--muted:#9aa89c;--line:#2e3a30;--accent:#6fc182;--on-accent:#0f1a12;--sock:#ff8a4d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:10px 16px 48px}
h2{font-size:1.15rem;margin:28px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font:600 .85rem system-ui,sans-serif;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:1rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px}
textarea{min-height:90px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sock);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}.row>div{min-width:0}
button{font:600 1rem system-ui,sans-serif;border:0;border-radius:8px;padding:13px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%;margin-top:12px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.stop{background:#c8102e;color:#fff}
.timer{font:700 2.4rem system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
.sig{margin:0 0 8px;text-align:center;font:.68rem system-ui,sans-serif;color:var(--muted);opacity:.7;letter-spacing:.03em}
.hint{color:var(--muted);font:.85rem system-ui,sans-serif;margin:6px 0 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-family:system-ui,sans-serif}
.item small{color:var(--muted);font-family:system-ui,sans-serif}
.del{width:auto;margin:0;padding:6px 8px;font-size:.85rem;background:transparent;color:var(--sock);border:1px solid var(--line)}
.acts{display:flex;gap:4px;align-items:center;flex-shrink:0}
.adj{width:auto;margin:0;padding:8px 10px;font-size:.95rem;background:transparent;color:var(--ink);border:1px solid var(--line)}
.item>div:first-child{min-width:0}
.min{color:#c8102e;font-weight:700;font-size:1.05rem}
.ck{width:.95em;height:.95em;vertical-align:-.12em;margin-right:.18em}
.nw{white-space:nowrap}
.no{color:var(--accent)}
.row.split>div:first-child{flex:2}
.row.split>div:last-child{flex:1}
.nt{font-style:italic}
#err:empty{display:none}
@keyframes blinkt{0%,100%{opacity:1}50%{opacity:.1}}
#err.blink{color:#c8102e;font:700 1.3rem system-ui,sans-serif;text-align:center;margin:10px 0 0;animation:blinkt 1s ease-in-out infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #err.blink{color:#ff6b6b}}
:root[data-theme="dark"] #err.blink{color:#ff6b6b}
@media (prefers-reduced-motion:reduce){#err.blink{animation:none}}
.manual{display:flex;gap:8px;align-items:stretch}
.stepbox{flex:1.7;min-width:0;display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepbox:focus-within{outline:3px solid var(--sock);outline-offset:1px}
.stepbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;border-radius:0;font-size:1.3rem;padding:14px 4px 14px 14px;-moz-appearance:textfield;appearance:textfield}
.stepbox input::-webkit-outer-spin-button,.stepbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepbox .stp{flex:0 0 48px;width:auto;margin:0;padding:0;border-radius:0;background:transparent;color:var(--ink);font-size:1.9rem;font-weight:700;line-height:1}
.manual #addman{flex:1;width:auto;margin:0;font-size:1.1rem}
@media (max-width:360px){.stepbox .stp{flex-basis:40px}.manual #addman{padding:0 8px;font-size:1rem}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .min{color:#ff6b6b}}
:root[data-theme="dark"] .min{color:#ff6b6b}
.sum{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;padding:6px 0}
.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:700}
.empty{color:var(--muted);padding:8px 0}
details summary{cursor:pointer;font-weight:700;margin-top:28px}
.once select{padding:8px 10px;font-size:.95rem}
.once label{font-weight:500}
@keyframes need{0%,100%{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.45)}50%{border-color:rgba(200,16,46,.25);box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.tow-box .need{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.45);animation:need 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tow-box .need{animation:none}}
.tow-box{background:var(--box);border:2px solid var(--accent);border-radius:12px;padding:2px 12px 14px;margin-top:16px}
.tow-box label{color:var(--ink);font-size:.95rem;font-weight:700}
.tow-box input,.tow-box select{font-size:1.2rem;padding:14px 12px;background:var(--surface);border:1px solid var(--accent)}
.runrow{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.clock{position:relative;flex:1;min-width:0;height:96px;display:flex;align-items:center;justify-content:center}
.clock svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.clock .timer{position:relative;margin:0;font-size:2.2rem}
#track{fill:none;stroke:var(--line);stroke-width:3}
#prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:butt}
#tug{fill:var(--sock);stroke:var(--surface);stroke-width:1;paint-order:stroke}
#glid{fill:var(--ink);stroke:var(--surface);stroke-width:1;paint-order:stroke}
.runrow button{flex:0 0 42%;width:auto;margin:0;font-size:1.9rem;font-weight:800;letter-spacing:.04em;padding:10px}
</style>
</head>
<body>
<main>
  <p class="sig">Tow Log by Adam Fulop (LHDK)</p>

<div class="panel">
  <div class="row once"><div><label for="pilot">Vontatópilóta</label><select id="pilot" aria-required="true"><option value="">Válassz…</option><option>Balasi László</option><option>Boskovitz Ábel</option><option>Donka Attila</option><option>Erdősi Béla</option><option>Fülöp Ádám</option><option>Kovács Péter</option><option>Laczkó Balázs</option><option>Szenes Gábor</option><option>Szíj Bálint</option><option>Szilágyi Tibor</option><option>Valastyán Máté</option><option>Veigli Szabolcs</option><option>Werner Miklós</option></select></div>
  <div><label for="tow">Vontatógép</label><select id="tow"></select></div></div>
  <div class="tow-box">
  <div class="row">
    <div><label for="glider">Vontatmány</label><input id="glider" placeholder="pl. HA-4321" autocapitalize="characters" autocomplete="off" list="dl-glider"><datalist id="dl-glider"></datalist></div>
    <div><label for="club">Klub</label><select id="club"><option value="">Válassz…</option><option>Malév</option><option>Opitz</option><option>Idegen</option><option>Nem tudom</option></select></div>
  </div>
  <div class="row split"><div><label for="payer">Költségviselő neve</label><input id="payer" aria-required="true" autocomplete="off" list="dl-payer"><datalist id="dl-payer"></datalist></div><div><label for="note">Megjegyzés</label><input id="note" autocomplete="off"></div></div></div>
  <div class="runrow">
    <div class="clock" id="clock">
      <svg id="ring" aria-hidden="true"><path id="track"/><path id="prog"/><line id="rope" style="stroke:var(--ink)" stroke-width="1.4"/><g id="glid"><g transform="scale(.85)"><ellipse cx="-1" rx="10" ry="1.4"/><path d="M3 -1.2L2 -14L-.4 -14L-.8 -1.2ZM3 1.2L2 14L-.4 14L-.8 1.2ZM-9 -.8L-10 -4.2L-11.6 -4.2L-11 -.6ZM-9 .8L-10 4.2L-11.6 4.2L-11 .6Z"/></g></g><g id="tug"><g transform="scale(.95)"><ellipse cx="-.5" rx="8.5" ry="2.3"/><path d="M2.5 -2L1 -9.5L-3 -9.5L-2.5 -2ZM2.5 2L1 9.5L-3 9.5L-2.5 2ZM-6.5 -1.2L-8.5 -4.8L-10.8 -4.8L-9.8 -.8ZM-6.5 1.2L-8.5 4.8L-10.8 4.8L-9.8 .8Z"/><path d="M9.6 -3.2V3.2" style="stroke:var(--ink)" stroke-width="1.3"/></g></g></svg>
      <div class="timer" id="timer">00:00</div>
    </div>
    <button id="startstop">START</button>
  </div>
  <p class="hint" id="err" role="alert"></p>
  <label for="min">…vagy perc kézzel</label>
  <div class="manual"><div class="stepbox"><input id="min" type="number" inputmode="numeric" min="1" placeholder="perc"><button class="stp" id="minus" aria-label="1 perccel kevesebb">−</button><button class="stp" id="plus" aria-label="1 perccel több">+</button></div><button class="alt" id="addman">Mentés</button></div>
</div>

<h2>Vontatások</h2>
<label for="date" style="margin-top:0">Nap</label><input id="date" type="date">
<div class="panel" id="list" style="margin-top:10px"></div>

<h2>Összesítés</h2>
<div class="panel" id="summary"></div>
<button id="send">Összesítés küldése emailben</button>
<p class="hint">Megnyílik az email alkalmazásod a kész szöveggel, neked csak a Küldés gombot kell megnyomnod.</p>
<div id="mailbox" class="panel" hidden style="margin-top:10px"><label for="mailtext" style="margin-top:0">Ha nem nyílt meg az email, másold ki a szöveget</label><textarea id="mailtext" readonly></textarea><button class="alt" id="copy">Szöveg másolása</button></div>

<details>
<summary>Beállítások</summary>
<div class="panel" style="margin-top:10px">
  <label for="s-fee">Indítási díj (Ft / vontatás)</label><input id="s-fee" type="number" inputmode="numeric" min="0">
  <label for="s-tows">Vontatógépek: soronként „rendszám;Klub=Ft/perc,Klub=Ft/perc” (vagy csak „rendszám;Ft/perc”, ha minden klubnak ugyanannyi)</label><textarea id="s-tows"></textarea>
  <button id="save">Beállítások mentése</button>
</div>
</details>
</main>

<script>
const KEY="vontatonaplo-v1";
const def={settings:{club:"",pilot:"",mail:"",fee:0,tows:"HA-FBL;Malév=2600,Opitz=2750\nOM-DJS;2800\nHA-TUS;0\nHA-SEP;0\nHA-MJC;0"},entries:[],pilots:{},timer:null};
let S=def;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign({},def,JSON.parse(r))}catch(e){}
if(/^HA-FBL;0\nOM-DJS;0/.test(S.settings.tows)||/^HA-VON1/.test(S.settings.tows))S.settings.tows=def.settings.tows;
S.pilots=S.pilots||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ft=n=>Math.round(n).toLocaleString("hu-HU")+" Ft";
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const CK='<svg class="ck" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.2V6l2 1.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const tows=()=>S.settings.tows.split("\n").map(l=>l.split(";")).filter(a=>a[0].trim()).map(a=>{const rates={};let def=0;(a[1]||"").split(",").forEach(p=>{const kv=p.split("=");const v=Number(kv[kv.length-1].trim())||0;if(kv.length>1)rates[kv[0].trim()]=v;else if(p.trim())def=v});return{name:a[0].trim(),rates,def}});
const rateFor=(t,club)=>t.rates[club]!==undefined?t.rates[club]:t.def;
const SND_START=[[880,.1],[1175,.18]],SND_STOP=[[1175,.12],[784,.3]];
let AC=null;
function beep(seq){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    let t=AC.currentTime+.02;
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
      t+=d+.04;
    });
  }catch(e){}
}
function warn(){
  try{
    if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance("Enter data");
      u.lang="en-US";u.rate=.95;u.volume=1;
      speechSynthesis.speak(u);
    }else beep([[330,.15],[330,.15]]);
  }catch(e){beep([[330,.15],[330,.15]])}
}
let ringL=0,looping=false;
const calm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function buildRing(){
  const c=$("clock"),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  const i=7,r=16,x1=w-i,y1=h-i,cx=w/2;
  const d=`M${cx} ${i}H${x1-r}A${r} ${r} 0 0 1 ${x1} ${i+r}V${y1-r}A${r} ${r} 0 0 1 ${x1-r} ${y1}H${i+r}A${r} ${r} 0 0 1 ${i} ${y1-r}V${i+r}A${r} ${r} 0 0 1 ${i+r} ${i}H${cx}`;
  $("ring").setAttribute("viewBox",`0 0 ${w} ${h}`);
  $("track").setAttribute("d",d);$("prog").setAttribute("d",d);
  ringL=$("track").getTotalLength();drawClock();
}
function pt(l){
  l=((l%ringL)+ringL)%ringL;const p=$("track"),a=p.getPointAtLength(l),b=p.getPointAtLength((l+2)%ringL);
  return{x:a.x,y:a.y,r:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI};
}
function drawClock(){
  if(!ringL)return;
  const t=S.timer?(Date.now()-S.timer.start)/1000:0;
  const len=((t%60)/60)*ringL;
  $("prog").setAttribute("stroke-dasharray",`${len} ${ringL+1}`);
  const a=pt(len),g=pt(len-46),ra=a.r*Math.PI/180,rg=g.r*Math.PI/180;
  $("tug").setAttribute("transform",`translate(${a.x} ${a.y}) rotate(${a.r})`);
  $("glid").setAttribute("transform",`translate(${g.x} ${g.y}) rotate(${g.r})`);
  const rp=$("rope");
  rp.setAttribute("x1",a.x-9*Math.cos(ra));rp.setAttribute("y1",a.y-9*Math.sin(ra));
  rp.setAttribute("x2",g.x+8*Math.cos(rg));rp.setAttribute("y2",g.y+8*Math.sin(rg));
}
function loop(){drawClock();if(S.timer&&!calm)requestAnimationFrame(loop);else looping=false}
function startLoop(){if(!looping&&S.timer&&!calm){looping=true;requestAnimationFrame(loop)}}

function fillTow(){const cur=$("tow").value;$("tow").innerHTML=tows().map(t=>`<option>${esc(t.name)}</option>`).join("");if(cur)$("tow").value=cur;if(S.timer)$("tow").value=S.timer.tow}
const MAIL="themiddleF@gmail.com";
function fillSettings(){const s=S.settings;$("s-fee").value=s.fee;$("s-tows").value=s.tows}

function markNeed(){["glider","club","payer"].forEach(id=>{const e=$(id);e.classList.toggle("need",!e.value.trim())});
  const m=$("err");
  if(m.textContent==="Enter data"&&!check($("date").value||today()))m.textContent="";
  m.classList.toggle("blink",m.textContent==="Enter data");
}
function check(date){
  if($("date").value===date)S.pilots[date]=$("pilot").value.trim();
  if(!(S.pilots[date]||"").trim())return "Enter data";
  if(!$("glider").value.trim())return "Enter data";
  if(!$("club").value)return "Enter data";
  if(!$("payer").value.trim())return "Enter data";
  return "";
}
function addEntry(minutes){
  const date=S.timer?S.timer.date:$("date").value||today();
  const msg=check(date);if(msg){$("err").textContent=msg;markNeed();return false}
  const glider=$("glider").value.trim().toUpperCase();
  if(!minutes||minutes<1){$("err").textContent="A vontatás legalább 1 perc.";return false}
  const t=tows().find(x=>x.name===$("tow").value)||{name:$("tow").value,rates:{},def:0};
  const club=$("club").value;S.entries.push({id:Date.now(),date,time:hm(S.timer?S.timer.start:Date.now()),tow:t.name,glider,club,payer:$("payer").value.trim(),note:$("note").value.trim(),pilot:S.pilots[date],rate:rateFor(t,club),minutes,price:Number(S.settings.fee)+minutes*rateFor(t,club)});
  S.timer=null;save();$("err").textContent="";$("glider").value="";$("payer").value="";$("note").value="";$("club").value="";$("min").value="";render();return true;
}
function tick(){
  drawClock();startLoop();markNeed();
  if(!S.timer){$("timer").textContent="00:00";return}
  const s=Math.floor((Date.now()-S.timer.start)/1000);
  $("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
$("startstop").onclick=()=>{
  if(!S.timer){const d=$("date").value||today();const msg=check(d);if(msg){$("err").textContent=msg;warn();markNeed();return}$("err").textContent="";S.timer={start:Date.now(),tow:$("tow").value,date:d,glider:$("glider").value.trim(),payer:$("payer").value.trim(),note:$("note").value.trim(),club:$("club").value};save();render();beep(SND_START);return}
  const mins=Math.max(1,Math.round((Date.now()-S.timer.start)/60000));
  if(!addEntry(mins))return;beep(SND_STOP);
};
$("addman").onclick=()=>addEntry(parseInt($("min").value,10));
$("save").onclick=()=>{S.settings={fee:Number($("s-fee").value)||0,tows:$("s-tows").value};save();fillSettings();fillTow();render()};
$("date").onchange=()=>{showPilot();render()};
$("pilot").onchange=()=>{S.pilots[$("date").value]=$("pilot").value.trim();save()};
function showPilot(){$("pilot").value=S.pilots[$("date").value]||""}

function day(){return S.entries.filter(e=>e.date===$("date").value)}
function groups(){
  const g={};
  day().forEach(e=>{const k=e.glider+(e.club?" ("+e.club+")":"")+" – "+(e.payer||"nincs név");g[k]=g[k]||{n:0,m:0,p:0};g[k].n++;g[k].m+=e.minutes;g[k].p+=e.price});
  return g;
}
function adjust(id,d){
  const e=S.entries.find(x=>x.id==id);if(!e)return;
  const m=e.minutes+d;if(m<1)return;
  const r=e.rate!==undefined?e.rate:rateFor(tows().find(t=>t.name===e.tow)||{rates:{},def:0},e.club);
  e.minutes=m;e.price+=d*r;e.edited=true;save();render();
}
function fillSuggest(){const d=day().slice().reverse();const u=k=>[...new Set(d.map(e=>(e[k]||"").trim()).filter(Boolean))];
  $("dl-glider").innerHTML=u("glider").map(v=>`<option value="${esc(v)}">`).join("");$("dl-payer").innerHTML=u("payer").map(v=>`<option value="${esc(v)}">`).join("")}
function render(){
  fillSuggest();const run=!!S.timer;
  $("startstop").textContent=run?"STOP":"START";
  $("startstop").className=run?"stop":"";
  $("tow").disabled=run;
  const L=day();
  $("list").innerHTML=L.length?L.map((e,i)=>`<div class="item"><div><b class="no">${i+1}.</b> <b>${esc(e.glider)}</b> ${e.club?'<small class="nw">('+esc(e.club)+')</small>':""}<br><small>${esc(e.payer||"nincs név")} · <b class="min">${e.minutes} perc</b>${e.time?' <span class="nw">('+CK+esc(e.time)+')</span>':""}${e.edited?" · javítva":""}</small>${e.note?'<br><small class="nt">'+esc(e.note)+'</small>':""}</div><div class="acts"><button class="adj" data-id="${e.id}" data-d="-1" aria-label="1 perccel kevesebb">−1</button><button class="adj" data-id="${e.id}" data-d="1" aria-label="1 perccel több">+1</button><button class="del" data-id="${e.id}" aria-label="Törlés">Töröl</button></div></div>`).join(""):'<div class="empty">Erre a napra még nincs vontatás.</div>';
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{S.entries=S.entries.filter(e=>e.id!=b.dataset.id);save();render()});
  document.querySelectorAll(".adj").forEach(b=>b.onclick=()=>adjust(b.dataset.id,Number(b.dataset.d)));
  const g=groups(),ks=Object.keys(g);
  let tn=0,tm=0,tp=0;
  $("summary").innerHTML=ks.length?ks.map(k=>{const x=g[k];tn+=x.n;tm+=x.m;tp+=x.p;return `<div class="sum"><span>${esc(k)}<br><small class="hint">${x.n} vontatás</small></span><b>${x.m} perc</b></div>`}).join("")+`<div class="sum total"><span>Összesen (${tn} vontatás)</span><span>${tm} perc</span></div>`:'<div class="empty">Nincs mit összesíteni.</div>';
  tick();
}
$("send").onclick=()=>{
  const g=groups(),ks=Object.keys(g);
  if(!ks.length){$("err").textContent="Nincs mit elküldeni erre a napra.";return}
  const s=S.settings;let tn=0,tm=0,tp=0;const pilots=[...new Set(day().map(e=>e.pilot).filter(Boolean))].join(", ");const nl=day().map((e,i)=>e.note?`${i+1}. ${e.glider}: ${e.note}`:"").filter(Boolean);const notes=nl.length?"\n\nMegjegyzések:\n"+nl.join("\n"):"";
  const lines=ks.map(k=>{const x=g[k];tn+=x.n;tm+=x.m;tp+=x.p;return `${k}: ${x.n} vontatás, ${x.m} perc`});
  const body=`Tow Log – vontatási összesítő\nNap: ${$("date").value}\nVontatópilóta: ${pilots||"-"}\n\n${lines.join("\n")}\n\nÖsszesen: ${tn} vontatás, ${tm} perc${notes}`;
  const url=`mailto:${MAIL}?subject=${encodeURIComponent("Tow Log vontatás "+$("date").value)}&body=${encodeURIComponent(body)}`;
$("mailtext").value=body;$("mailbox").hidden=false;
try{const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}catch(e){}
};

$("date").value=today();
fillSettings();fillTow();showPilot();if(S.timer){$("glider").value=S.timer.glider||"";$("payer").value=S.timer.payer||"";$("note").value=S.timer.note||"";if(S.timer.club)$("club").value=S.timer.club}
render();
$("copy").onclick=()=>{const t=$("mailtext");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand("copy")}catch(e2){}}};
setInterval(tick,1000);
$("glider").oninput=markNeed;
$("payer").oninput=markNeed;
$("club").onchange=markNeed;
$("plus").onclick=()=>{$("min").value=Math.max(1,(parseInt($("min").value,10)||0)+1)};
$("minus").onclick=()=>{$("min").value=Math.max(1,(parseInt($("min").value,10)||0)-1)};
buildRing();
window.addEventListener("resize",buildRing);
if(window.ResizeObserver)new ResizeObserver(buildRing).observe($("clock"));
// Képernyő ébren tartása, amíg az oldal nyitva van (Screen Wake Lock)
let wl=null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||(wl&&!wl.released))return;
    wl=await navigator.wakeLock.request("screen");
    wl.addEventListener("release",()=>{wl=null});
  }catch(e){wl=null}
}
keepAwake();
document.addEventListener("visibilitychange",keepAwake);
["pointerdown","touchend","keydown"].forEach(ev=>document.addEventListener(ev,keepAwake,{passive:true}));
</script>
