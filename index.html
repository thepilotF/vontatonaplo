<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d6a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tow Log">
<title>Tow Log</title>
<style>
:root{--bg:#f1efe4;--surface:#fffffb;--ink:#1c2a1e;--muted:#5b695d;--line:#d6d3c2;--accent:#2d6a3a;--on-accent:#fff;--sock:#e2561a;--box:#e6f0e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--box:#243a2a;--bg:#121813;--surface:#1b241d;--ink:#e8ede6;--muted:#9aa89c;--line:#2e3a30;--accent:#6fc182;--on-accent:#0f1a12;--sock:#ff8a4d;color-scheme:dark}}
:root[data-theme="dark"]{--box:#243a2a;--bg:#121813;--surface:#1b241d;--ink:#e8ede6;--muted:#9aa89c;--line:#2e3a30;--accent:#6fc182;--on-accent:#0f1a12;--sock:#ff8a4d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:10px 16px 48px}
h2{font-size:1.15rem;margin:28px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font:600 .85rem system-ui,sans-serif;color:var(--muted);margin:10px 0 4px}
input[type=date]{display:block;width:100%;max-width:100%;min-width:0;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{width:100%;font:1rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px}
textarea{min-height:90px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sock);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}.row>div{min-width:0}
button{font:600 1rem system-ui,sans-serif;border:0;border-radius:8px;padding:13px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%;margin-top:12px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.stop{background:#c8102e;color:#fff}
.timer{font:700 2.4rem system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
.sig{margin:0 0 8px;text-align:center;font:.68rem system-ui,sans-serif;color:var(--muted);opacity:.7;letter-spacing:.03em}
.hint{color:var(--muted);font:.85rem system-ui,sans-serif;margin:6px 0 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-family:system-ui,sans-serif}
.item small{color:var(--muted);font-family:system-ui,sans-serif}
.fixclub{font:700 .85rem system-ui,sans-serif;padding:4px 6px;border:2px solid #c8102e;border-radius:8px;background:var(--surface);color:var(--ink);animation:blinkt 1s ease-in-out infinite;width:auto;max-width:9.5em}
@media (prefers-reduced-motion:reduce){.fixclub{animation:none}}
.del{width:auto;margin:0;padding:6px 8px;font-size:.85rem;background:transparent;color:var(--sock);border:1px solid var(--line)}
.acts{display:flex;gap:4px;align-items:center;flex-shrink:0}
.adj{width:auto;margin:0;padding:8px 10px;font-size:.95rem;background:transparent;color:var(--ink);border:1px solid var(--line)}
.item>div:first-child{min-width:0}
.min{color:#c8102e;font-weight:700;font-size:1.05rem}
.ck{width:.95em;height:.95em;vertical-align:-.12em;margin-right:.18em}
.nw{white-space:nowrap}
.no{color:var(--accent)}
.row.split>div:first-child{flex:2}
.row.split>div:last-child{flex:1}
.nt{font-style:italic}
#err:empty{display:none}
@keyframes blinkt{0%,100%{opacity:1}50%{opacity:.1}}
#err.blink{color:#c8102e;font:700 1.3rem system-ui,sans-serif;text-align:center;margin:10px 0 0;animation:blinkt 1s ease-in-out infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #err.blink{color:#ff6b6b}}
:root[data-theme="dark"] #err.blink{color:#ff6b6b}
@media (prefers-reduced-motion:reduce){#err.blink{animation:none}}
.manual{display:flex;gap:8px;align-items:stretch}
.stepbox{flex:1.7;min-width:0;display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepbox:focus-within{outline:3px solid var(--sock);outline-offset:1px}
.stepbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;border-radius:0;font-size:1.3rem;padding:14px 4px 14px 14px;-moz-appearance:textfield;appearance:textfield}
.stepbox input::-webkit-outer-spin-button,.stepbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepbox .stp{flex:0 0 48px;width:auto;margin:0;padding:0;border-radius:0;background:transparent;color:var(--ink);font-size:1.9rem;font-weight:700;line-height:1}
.manual #addman{flex:1;width:auto;margin:0;font-size:1.1rem}
@media (max-width:360px){.stepbox .stp{flex-basis:40px}.manual #addman{padding:0 8px;font-size:1rem}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .min{color:#ff6b6b}}
:root[data-theme="dark"] .min{color:#ff6b6b}
.sum{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;padding:6px 0}
.sum .r{text-align:right}
.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:700}
.empty{color:var(--muted);padding:8px 0}
details summary{cursor:pointer;font-weight:700;margin-top:28px}
.once select{padding:8px 10px;font-size:1rem}
.once label{font-weight:500}
@keyframes need{0%,100%{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.45)}50%{border-color:rgba(200,16,46,.25);box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.tow-box .need{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.45);animation:need 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tow-box .need{animation:none}}
.tow-box{background:var(--box);border:2px solid var(--accent);border-radius:12px;padding:2px 12px 14px;margin-top:16px}
.tow-box label{color:var(--ink);font-size:.95rem;font-weight:700}
.tow-box input,.tow-box select{font-size:1.2rem;padding:14px 12px;background:var(--surface);border:1px solid var(--accent)}
.runrow{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.clock{position:relative;flex:1;min-width:0;height:96px;display:flex;align-items:center;justify-content:center}
.clock svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.clock .timer{position:relative;margin:0;font-size:2.2rem}
#track{fill:none;stroke:var(--line);stroke-width:3}
#prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:butt}
#tug{fill:var(--sock);stroke:var(--surface);stroke-width:1;paint-order:stroke}
#glid{fill:var(--ink);stroke:var(--surface);stroke-width:1;paint-order:stroke}
.runrow button{flex:0 0 28%;width:auto;margin:0;font-size:clamp(1rem,5vw,1.35rem);font-weight:800;letter-spacing:.02em;padding:6px 2px}
.runrow button.gps{flex:0 0 14%;background:#1a6fd4;color:#fff;font-size:clamp(.72rem,3.3vw,.95rem);letter-spacing:0}
.runrow button.gps.on{background:#0b4aa8;box-shadow:0 0 0 3px #7fb3ff;animation:gpsp 1.6s ease-in-out infinite}
@keyframes gpsp{0%,100%{box-shadow:0 0 0 3px #7fb3ff}50%{box-shadow:0 0 0 6px rgba(127,179,255,.25)}}
button:disabled{background:#a9aca8!important;color:#eceee9!important;cursor:not-allowed;box-shadow:none!important;animation:none!important}
#send{background:#1a6fd4;color:#fff;font-size:1.15rem;font-weight:800;padding:16px}
#sheetmsg.ok{color:var(--accent);font:800 1rem system-ui,sans-serif;text-align:center;margin-top:10px}
#sheetmsg.err{color:#c8102e;font-weight:700}
.pinbox{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.pinbox[hidden]{display:none}
.pincard{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:20px;width:100%;max-width:340px;text-align:center}
.pincard h2{margin:0 0 6px}
#pin{font-size:1.6rem;text-align:center;letter-spacing:.3em;width:100%}
#pinmsg{color:#c8102e;min-height:1.2em}
#sheetmsg.pend{color:#b45f00;font-weight:700}
.gpsinfo{margin:8px 0 0;text-align:center;font:600 .85rem system-ui,sans-serif;color:#1a6fd4}
.gpsinfo[hidden]{display:none}
:root[data-theme="dark"] .gpsinfo{color:#7fb3ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gpsinfo{color:#7fb3ff}}
@media (prefers-reduced-motion:reduce){.runrow button.gps.on{animation:none}}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:2px solid var(--accent);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-height:230px;overflow:auto;-webkit-overflow-scrolling:touch}
.sug[hidden]{display:none}
.sug button{display:block;width:100%;margin:0;border-radius:0;background:transparent;color:var(--ink);text-align:left;font:700 1.15rem system-ui,sans-serif;padding:13px 14px;min-height:48px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--box)}
.sig i{font-style:normal;opacity:.6;margin-left:.6em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips:empty{display:none}
.chips button{width:auto;margin:0;padding:10px 14px;min-height:44px;font:700 1.05rem system-ui,sans-serif;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:999px}
#ch-glider,#ch-payer{gap:6px}
#ch-glider button,#ch-payer button{padding:7px 9px;min-height:30px;font-size:.7rem}
.chips button.sel{background:var(--accent);color:var(--on-accent)}
</style>
</head>
<body>
<main>
  <p class="sig">Tow Log by Adam Fulop (LHDK)<i>v58</i></p>

<div class="panel">
  <div class="row once"><div><label for="pilot">Vontatópilóta</label><select id="pilot" aria-required="true"><option value="">Válassz…</option></select></div>
  <div><label for="tow">Vontatógép</label><select id="tow"></select></div></div>
  <div class="tow-box">
  <div class="row">
    <div><label for="glider">Vontatmány</label><input id="glider" placeholder="pl. HA-4321" autocapitalize="characters" autocomplete="off"></div>
    <div><label for="club">Klub</label><select id="club"><option value="">Válassz…</option><option>Malév</option><option>Opitz</option><option>Idegen</option><option>Nem tudom</option></select></div>
  </div>
  <div class="chips" id="ch-glider"></div>
  <div class="row split"><div><label for="payer">Költségviselő neve</label><input id="payer" aria-required="true" autocomplete="off"></div><div><label for="note">Megjegyzés</label><input id="note" autocomplete="off"></div></div><div class="chips" id="ch-payer"></div></div>
  <div class="runrow">
    <div class="clock" id="clock">
      <svg id="ring" aria-hidden="true"><path id="track"/><path id="prog"/><line id="rope" style="stroke:var(--ink)" stroke-width="1.4"/><g id="glid"><g transform="scale(.85)"><ellipse cx="-1" rx="10" ry="1.4"/><path d="M3 -1.2L2 -14L-.4 -14L-.8 -1.2ZM3 1.2L2 14L-.4 14L-.8 1.2ZM-9 -.8L-10 -4.2L-11.6 -4.2L-11 -.6ZM-9 .8L-10 4.2L-11.6 4.2L-11 .6Z"/></g></g><g id="tug"><g transform="scale(.95)"><ellipse cx="-.5" rx="8.5" ry="2.3"/><path d="M2.5 -2L1 -9.5L-3 -9.5L-2.5 -2ZM2.5 2L1 9.5L-3 9.5L-2.5 2ZM-6.5 -1.2L-8.5 -4.8L-10.8 -4.8L-9.8 -.8ZM-6.5 1.2L-8.5 4.8L-10.8 4.8L-9.8 .8Z"/><path d="M9.6 -3.2V3.2" style="stroke:var(--ink)" stroke-width="1.3"/></g></g></svg>
      <div class="timer" id="timer">00:00</div>
    </div>
    <button id="gpsbtn" class="gps" type="button" aria-pressed="false">GPS</button>
    <button id="startstop">START</button>
  </div>
  <p class="gpsinfo" id="gpsinfo" hidden></p>
  <p class="hint" id="err" role="alert"></p>
  <label for="min">…vagy perc kézzel</label>
  <div class="manual"><div class="stepbox"><input id="min" type="number" inputmode="numeric" min="1" placeholder="perc"><button class="stp" id="minus" aria-label="1 perccel kevesebb">−</button><button class="stp" id="plus" aria-label="1 perccel több">+</button></div><button class="alt" id="addman">Mentés</button></div>
</div>

<h2>Vontatások</h2>
<label for="date" style="margin-top:0">Nap</label><input id="date" type="date">
<div class="panel" id="list" style="margin-top:10px"></div>

<h2>Összesítés</h2>
<div class="panel" id="summary"></div>
<button id="send">Nap lezárása, mentés</button>
<p class="hint" id="sheetmsg" role="status"></p>

<details id="hist">
<summary>Korábbi napok megtekintése</summary>
<div class="panel" style="margin-top:10px">
  <label for="hdate" style="margin-top:0">Nap</label><input id="hdate" type="date">
  <p class="hint" id="hnote"></p>
  <div id="hlist"></div>
  <div id="hsum"></div>
</div>
</details>

<details>
<summary>Beállítások</summary>
<div class="panel" style="margin-top:10px">
  <button id="refreshcfg" class="alt" type="button">Adatok frissítése a táblázatból</button>
  <p class="hint" id="cfgstatus"></p>
</div>
</details>
</main>
<div id="pinbox" class="pinbox" hidden><div class="pincard"><h2>Tow Log</h2><p>Add meg a klub PIN-kódját</p><p class="hint">Segítség: a PIN a HA-FBL típusszáma: Zlin ***LSi</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN-kód"><p class="hint" id="pinmsg" role="alert"></p><button id="pinok" type="button">Belépés</button></div></div>

<script>
const KEY="vontatonaplo-v1";
var gps={on:false};
const def={settings:{fee:0},cfg:null,outbox:{up:{},del:{}},saved:{},entries:[],pilots:{},timer:null};
let S=def;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign({},def,JSON.parse(r))}catch(e){}
S.pilots=S.pilots||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ft=n=>Math.round(n).toLocaleString("hu-HU")+" Ft";
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const CK='<svg class="ck" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.2V6l2 1.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const tows=()=>{const m={},order=[];((S.cfg&&S.cfg.prices)||[]).forEach(p=>{if(!m[p.tow]){m[p.tow]={name:p.tow,rates:{},def:0};order.push(p.tow)}if(p.club==="*")m[p.tow].def=p.rate;else m[p.tow].rates[p.club]=p.rate});return order.map(n=>m[n])};
const rateFor=(t,club)=>t.rates[club]!==undefined?t.rates[club]:t.def;
const SND_START=[[880,.1],[1175,.18]],SND_STOP=[[1175,.12],[784,.3]];
let AC=null;
function beep(seq){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    let t=AC.currentTime+.02;
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
      t+=d+.04;
    });
  }catch(e){}
}
function warn(){
  try{
    if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance("Enter data");
      u.lang="en-US";u.rate=.95;u.volume=1;
      speechSynthesis.speak(u);
    }else beep([[330,.15],[330,.15]]);
  }catch(e){beep([[330,.15],[330,.15]])}
}
let ringL=0,looping=false;
const calm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function buildRing(){
  const c=$("clock"),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  const i=7,r=16,x1=w-i,y1=h-i,cx=w/2;
  const d=`M${cx} ${i}H${x1-r}A${r} ${r} 0 0 1 ${x1} ${i+r}V${y1-r}A${r} ${r} 0 0 1 ${x1-r} ${y1}H${i+r}A${r} ${r} 0 0 1 ${i} ${y1-r}V${i+r}A${r} ${r} 0 0 1 ${i+r} ${i}H${cx}`;
  $("ring").setAttribute("viewBox",`0 0 ${w} ${h}`);
  $("track").setAttribute("d",d);$("prog").setAttribute("d",d);
  ringL=$("track").getTotalLength();drawClock();
}
function pt(l){
  l=((l%ringL)+ringL)%ringL;const p=$("track"),a=p.getPointAtLength(l),b=p.getPointAtLength((l+2)%ringL);
  return{x:a.x,y:a.y,r:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI};
}
function drawClock(){
  if(!ringL)return;
  const t=S.timer?(Date.now()-S.timer.start)/1000:0;
  const len=((t%60)/60)*ringL;
  $("prog").setAttribute("stroke-dasharray",`${len} ${ringL+1}`);
  const a=pt(len),g=pt(len-46),ra=a.r*Math.PI/180,rg=g.r*Math.PI/180;
  $("tug").setAttribute("transform",`translate(${a.x} ${a.y}) rotate(${a.r})`);
  $("glid").setAttribute("transform",`translate(${g.x} ${g.y}) rotate(${g.r})`);
  const rp=$("rope");
  rp.setAttribute("x1",a.x-9*Math.cos(ra));rp.setAttribute("y1",a.y-9*Math.sin(ra));
  rp.setAttribute("x2",g.x+8*Math.cos(rg));rp.setAttribute("y2",g.y+8*Math.sin(rg));
}
function loop(){drawClock();if(S.timer&&!calm)requestAnimationFrame(loop);else looping=false}
function startLoop(){if(!looping&&S.timer&&!calm){looping=true;requestAnimationFrame(loop)}}

function fillTow(){const cur=$("tow").value;$("tow").innerHTML=tows().map(t=>`<option>${esc(t.name)}</option>`).join("");if(cur)$("tow").value=cur;if(S.timer)$("tow").value=S.timer.tow}
const SHEET_URL="https://script.google.com/macros/s/AKfycbzVlCDMXDa9sjq_efUi5AtD9fqOKs4NhIKCj4VALPgq3Px5368g25u48rlc_J-3fN1u/exec";
const PINKEY="vontatonaplo-pin";
const getPin=()=>{try{return localStorage.getItem(PINKEY)||""}catch(e){return ""}};
const setPin=v=>{try{if(v)localStorage.setItem(PINKEY,v);else localStorage.removeItem(PINKEY)}catch(e){}};
const newId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function sheetMsg(t,kind){const m=$("sheetmsg");if(m){m.textContent=t;m.dataset.kind=kind||"";m.className="hint "+(kind||"")}}
function entryPayload(e){return{id:String(e.id),date:e.date,payer:e.payer||"",tow:e.tow||"",minutes:e.minutes,pilot:e.pilot||"",club:e.club||"",time:e.time||"",glider:e.glider||"",note:e.note||""}}
function ensureOutbox(){if(!S.outbox||!S.outbox.up||!S.outbox.del)S.outbox={up:{},del:{}}}
function pendingCount(){ensureOutbox();return Object.keys(S.outbox.up).length+Object.keys(S.outbox.del).length}
function daySig(d){return JSON.stringify(S.entries.filter(e=>e.date===d).map(entryPayload))}
function dayClosed(d){return !!(S.saved&&S.saved[d]&&S.saved[d]===daySig(d)&&!pendingCount())}
function qUp(id){const e=S.entries.find(x=>x.id==id);if(!e)return;ensureOutbox();S.outbox.up[String(id)]=entryPayload(e);delete S.outbox.del[String(id)];save();flushOutbox()}
function qDel(id){ensureOutbox();delete S.outbox.up[String(id)];S.outbox.del[String(id)]=1;save();flushOutbox()}
function syncCloseBtn(){
  const b=$("send");if(!b)return;const d=$("date").value||today();const closed=dayClosed(d);
  b.disabled=closed;b.classList.toggle("done",closed);
  if(closed)sheetMsg("Az adatok mentése sikeresen megtörtént ✓","ok");
  else if($("sheetmsg").dataset.kind==="ok")sheetMsg("");

function showPin(msg){const b=$("pinbox");b.hidden=false;$("pinmsg").textContent=msg||"";$("pin").value="";try{$("pin").focus()}catch(e){}}
function hidePin(){$("pinbox").hidden=true}
function handleErr(code){
  if(code==="pin"){setPin("");showPin("Hibás PIN-kód.")}
  else if(code==="locked"){setPin("");showPin("Túl sok hibás próbálkozás, próbáld újra 10 perc múlva.")}
  else pendMsg(code)
}
function pendMsg(why){const n=pendingCount();if(n)sheetMsg("Mentésre vár: "+n+" tétel ("+why+"). Később automatikusan elmegy.","pend")}
async function api(body){
  const tries=(body.op==="config"||body.op==="day")?3:1;let r;
  for(let i=1;;i++){
    try{r=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pin:getPin()},body))});break}
    catch(e){if(i>=tries)throw e;await new Promise(f=>setTimeout(f,i*700))}
  }
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(x){throw new Error("HTTP "+r.status+", nem JSON válasz")}
  return j;
}
async function flushOnce(){
  ensureOutbox();
  const ups=Object.values(S.outbox.up),dels=Object.keys(S.outbox.del);
  if(!ups.length&&!dels.length)return true;
  if(!getPin()){showPin("");return false}
  try{
    const j=await api({op:"sync",upserts:ups,deletes:dels});
    if(j.ok){
      ups.forEach(u=>{const cur=S.outbox.up[u.id];if(cur&&JSON.stringify(cur)===JSON.stringify(u))delete S.outbox.up[u.id]});
      dels.forEach(i=>{delete S.outbox.del[i]});save();
      if(j.skipped>0){sheetMsg("Egy tétel adata érvénytelen, ellenőrizd a klubot és a vontatógépet.","err");return false}
      if($("sheetmsg").dataset.kind==="pend")sheetMsg("");
      return !pendingCount();
    }
    handleErr(j.error);return false;
  }catch(e){pendMsg(e&&e.message||"hálózati hiba");return false}
}
let flushP=null,flushAgain=false;
function flushOutbox(){
  if(!SHEET_URL)return Promise.resolve(false);
  if(flushP){flushAgain=true;return flushP}
  flushP=(async()=>{let ok=true;do{flushAgain=false;ok=await flushOnce()}while(flushAgain);return ok})().finally(()=>{flushP=null;render()});
  return flushP;
}
async function loadConfig(){
  if(!getPin()){showPin("");return false}
  try{
    const j=await api({op:"config"});
    if(j.ok){S.cfg=j.config;save();fillPilots();fillTow();hidePin();render();$("cfgstatus").textContent="Frissítve: "+new Date().toLocaleString("hu-HU");return true}
    handleErr(j.error);
  }catch(e){
    $("cfgstatus").textContent="Nincs kapcsolat, a korábban letöltött lista van használatban.";
    if(!S.cfg)sheetMsg("Nincs kapcsolat. Az első indításhoz internet kell.","err");
  }
  return false;
}

function check(date){
  if($("date").value===date)S.pilots[date]=$("pilot").value.trim();
  if(!(S.pilots[date]||"").trim())return "Enter data";
  if(!$("glider").value.trim())return "Enter data";
  if(!$("club").value)return "Enter data";
  if(!$("payer").value.trim())return "Enter data";
  return "";
}
function addEntry(minutes,o){
  const date=o?o.date:S.timer?S.timer.date:$("date").value||today();
  const msg=check(date);if(msg){$("err").textContent=msg;markNeed();return false}
  const glider=$("glider").value.trim().toUpperCase();
  if(!minutes||minutes<1){$("err").textContent="A vontatás legalább 1 perc.";return false}
  const t=tows().find(x=>x.name===$("tow").value)||{name:$("tow").value,rates:{},def:0};
  const club=$("club").value;S.entries.push({id:newId(),date,time:hm(o?o.start:S.timer?S.timer.start:Date.now()),tow:t.name,glider,club,payer:$("payer").value.trim(),note:$("note").value.trim(),pilot:S.pilots[date],rate:rateFor(t,club),minutes,price:Number(S.settings.fee)+minutes*rateFor(t,club)});
  S.timer=null;save();qUp(S.entries[S.entries.length-1].id);$("err").textContent="";$("glider").value="";$("payer").value="";$("note").value="";$("club").value="";$("min").value="";render();return true;
}

  $("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function adjust(id,d){
  const e=S.entries.find(x=>x.id==id);if(!e)return;

  const r=e.rate!==undefined?e.rate:rateFor(tows().find(t=>t.name===e.tow)||{rates:{},def:0},e.club);
  e.minutes=m;e.price+=d*r;e.edited=true;save();qUp(id);render();
}

async function loadHist(){
  const d=$("hdate").value,tok=++histTok;
  if(!d){$("hlist").innerHTML="";$("hsum").innerHTML="";$("hnote").textContent="";return}
  $("hnote").textContent="Betöltés…";
  if(!getPin()){showPin("");renderHist(d,histRows(d),true);return}
  try{
    const j=await api({op:"day",date:d});
    if(tok!==histTok)return;
    if(j.ok&&Array.isArray(j.rows)){renderHist(d,j.rows,false);return}
    if(j.error==="pin"||j.error==="locked"){handleErr(j.error);return}
    renderHist(d,histRows(d),true);
  }catch(e){if(tok===histTok)renderHist(d,histRows(d),true)}
}

const GPS_KMH=20,GPS_STOP=80,GPS_N=3;
function completePending(){
  const p=S.pending;if(!p)return;
  if(check(p.date))return;
  S.pending=null;addEntry(p.minutes,{date:p.date,start:p.start});
}
function distM(a,b){const R=6371000,r=Math.PI/180,dl=(b.latitude-a.latitude)*r,dg=(b.longitude-a.longitude)*r,
  x=Math.sin(dl/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function gpsOff(){
  if(gps.id!=null){try{navigator.geolocation.clearWatch(gps.id)}catch(e){}}
  gps={on:false,id:null,up:0,upTs:0,dn:0,dnTs:0,last:null,fast:false};render();
}
function gpsInfo(kmh){
  const v=kmh==null?"…":Math.round(kmh)+" km/h";
  $("gpsinfo").textContent=S.timer?`GPS: ${v} · leáll ${GPS_STOP} km/h alatt`:`GPS: ${v} · indul ${GPS_KMH} km/h fölött`;
}
function gpsFix(pos){
  if(!gps.on)return;
  const c=pos.coords;let v=c.speed;
  if((v==null||isNaN(v))&&gps.last){const dt=(pos.timestamp-gps.last.t)/1000;if(dt>.4)v=distM(gps.last.c,c)/dt}
  gps.last={c:{latitude:c.latitude,longitude:c.longitude},t:pos.timestamp};
  if(v==null||isNaN(v)){gpsInfo(null);return}
  const kmh=v*3.6;gpsInfo(kmh);
  if(!S.timer){
    if(kmh>=GPS_KMH){if(!gps.up)gps.upTs=pos.timestamp;gps.up++}else gps.up=0;
    if(gps.up>=GPS_N){
      const d=$("date").value||today();
      S.timer={start:Math.min(gps.upTs,Date.now()),tow:$("tow").value,date:d,glider:$("glider").value.trim(),payer:$("payer").value.trim(),note:$("note").value.trim(),club:$("club").value};
      gps.up=0;gps.dn=0;gps.fast=false;save();render();gpsInfo(kmh);beep(SND_START);
    }
  }else{
    if(kmh>=GPS_STOP)gps.fast=true;
    const lim=gps.fast?GPS_STOP:GPS_KMH;
    if(kmh<lim){if(!gps.dn)gps.dnTs=pos.timestamp;gps.dn++}else gps.dn=0;
    if(gps.dn>=GPS_N&&pos.timestamp-S.timer.start>30000){
      const mins=Math.max(1,Math.round((gps.dnTs-S.timer.start)/60000));
      const d=S.timer.date,start=S.timer.start;
      if(!check(d)){addEntry(mins)}
      else{S.pending={date:d,start,minutes:mins};S.timer=null;save();$("err").textContent="Enter data";warn();markNeed()}
      beep(SND_STOP);gpsOff();
    }
  }
}
$("gpsbtn").onclick=()=>{
  if(gps.on){gpsOff();return}
  if(S.timer)return;
  if(!navigator.geolocation){$("err").textContent="Ez a böngésző nem támogatja a GPS-t.";return}
  const d=$("date").value||today();const msg=check(d);
  if(msg){$("err").textContent=msg;warn();markNeed();return}
  $("err").textContent="";
  try{keepAwake()}catch(e){}
  gps={on:true,id:null,up:0,upTs:0,dn:0,dnTs:0,last:null,fast:false};
  gps.id=navigator.geolocation.watchPosition(gpsFix,er=>{
    if(er&&er.code===1){$("err").textContent="A GPS nem engedélyezett – engedélyezd a helymeghatározást a böngészőben.";gpsOff()}
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  gpsInfo(null);render();
};

// Képernyő ébren tartása, amíg az oldal nyitva van (Screen Wake Lock)
let wl=null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||(wl&&!wl.released))return;
    wl=await navigator.wakeLock.request("screen");
    wl.addEventListener("release",()=>{wl=null});
  }catch(e){wl=null}
}
keepAwake();
document.addEventListener("visibilitychange",keepAwake);
["pointerdown","touchend","keydown"].forEach(ev=>document.addEventListener(ev,keepAwake,{passive:true}));
</script>
